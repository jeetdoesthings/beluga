[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beluga-research"
version = "0.1.0"
description = "Beluga 0.1 — Python research implementation proving the core spatial-audio mathematics (VBAP, listener-relative geometry, offline rendering)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
beluga-render = "beluga.cli:main"

[tool.setuptools.packages.find]
where = ["research/python"]

[tool.pytest.ini_options]
testpaths = ["research/python/tests"]