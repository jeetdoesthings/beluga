[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beluga-research"
version = "0.5.0"
description = "Beluga 0.3 — Python research implementation with real-time Rust audio engine bridge. Proves core spatial-audio mathematics (VBAP, listener-relative geometry) with native playback via CPAL."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
beluga-render = "beluga.cli:main"

[tool.setuptools.packages.find]
where = ["research/python"]

[tool.pytest.ini_options]
testpaths = ["research/python/tests"]